<script>
  // Base pública da API do Dash (backend próprio: auth JWT + Asaas).
  // Trocar pela URL de produção no deploy. NENHUM segredo aqui — o cliente
  // (components/api.js) guarda o access token só em memória e o refresh
  // token vive num cookie httpOnly.
  window.__API_URL = "https://dashproject-backend.onrender.com";
  // E-mail de contato exibido em "Fale com a gente" (vazio = link oculto).
  window.__CONTACT_EMAIL = "";

  // Vercel Web Analytics (sem cookies). Ativar em Vercel → projeto → Analytics.
  // O auto-track fica desligado: o app é uma página só, e a URL pode carregar
  // tokens (?verify=, ?reset=, ?s=). O App manda um pageview por tela com um
  // caminho virtual (/upload, /dashboard…) via dashTrackView; eventos-chave
  // via dashTrack (eventos personalizados exigem o plano Pro da Vercel).
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  window.dashTrackView = function (name) {
    try { window.va("pageview", { route: "/" + name, path: "/" + name }); } catch (e) {}
  };
  window.dashTrack = function (name, data) {
    try { window.va("event", { name: name, data: data || {} }); } catch (e) {}
  };
  if (!/^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(window.location.hostname)) {
    var vaScript = document.createElement("script");
    vaScript.defer = true;
    vaScript.src = "/_vercel/insights/script.js";
    vaScript.setAttribute("data-disable-auto-track", "1");
    document.head.appendChild(vaScript);
  }
</script>

<style>
  /* Linguagem visual inspirada nos sistemas da Apple (CLAUDE.md §4): fonte do
     sistema (SF Pro nos aparelhos Apple, Geist nos demais), cinza #f5f5f7,
     materiais de vidro, cantos contínuos e botões em pílula. */
  :root{
    --bg: #f5f5f7;
    --bg-2: #ffffff;
    --ink: #1d1d1f;
    --ink-2: #3a3a3c;
    --muted: #6e6e73;
    --muted-2: #86868b;
    --line: #e3e3e8;
    --line-2: #f0f0f3;
    --brand: #0071e3;
    --brand-2: #0062c4;
    --brand-soft: #e8f2fd;
    --accent: #34c759;
    --warn: #ff9500;
    --pink: #ff375f;
    --violet: #5e5ce6;
    --fill: rgba(118,118,128,.12);
    --fill-2: rgba(118,118,128,.08);
    --hairline: rgba(0,0,0,.08);
    --glass: rgba(255,255,255,.72);
    --glass-strong: rgba(255,255,255,.86);
    --glass-blur: saturate(180%) blur(20px);
    --ease-ios: cubic-bezier(.32,.72,0,1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Geist", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", SFMono-Regular, "Geist Mono", Menlo, monospace;
    --shadow-card: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px -10px rgba(0,0,0,.10);
    --shadow-pop: 0 1px 3px rgba(0,0,0,.06), 0 24px 60px -18px rgba(0,0,0,.28);
  }
  *{ box-sizing:border-box; }
  html, body{ margin:0; padding:0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; font-feature-settings: "kern"; }
  ::selection{ background: color-mix(in oklch, var(--brand) 22%, white); }
  svg text{ font-variant-numeric: tabular-nums; }
  body{ overflow-x: hidden; }
  a{ color: inherit; text-decoration: none; }
  button{ font-family: inherit; }
  .mono{ font-family: var(--font-mono); }

  /* Scroll progress bar */
  #scroll-progress{
    position: fixed; top: 0; left: 0; height: 2px; width: 0%;
    background: var(--brand);
    z-index: 100; transition: width 80ms linear;
  }

  /* Reveal */
  .rv{ opacity: 0; transform: translateY(24px); transition: opacity .9s var(--ease-ios), transform .9s var(--ease-ios), filter .9s var(--ease-ios); }
  .rv.in{ opacity: 1; transform: none; }
  .rv-up{ transform: translateY(40px); }
  .rv-left{ transform: translateX(-32px); }
  .rv-right{ transform: translateX(32px); }
  .rv-scale{ transform: scale(.96); }
  .rv-blur{ filter: blur(8px); }
  .rv.in.rv-blur{ filter: blur(0); }

  /* Hero */
  .hero-bg{
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  }
  .hero-blob{
    position:absolute; border-radius: 50%; filter: blur(90px); opacity: .22;
  }
  .grid-bg{
    position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(0,0,0,.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,.035) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
  }

  /* Sticky pin section */
  .pin-wrap{ position: relative; }
  .pin-stage{ position: sticky; top: 0; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

  /* Cards */
  .card{
    background: var(--bg-2); border: 1px solid var(--hairline);
    border-radius: 20px;
  }
  .soft-shadow{ box-shadow: var(--shadow-card); }
  /* Material de vidro (barras, menus, sheets). */
  .glass{ background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }

  /* Buttons */
  /* Botões em pílula: primário preenchido; secundário em cinza translúcido. */
  .btn{
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px;
    border-radius: 980px; font-weight: 500; font-size: 14px; letter-spacing: -.01em; white-space: nowrap; border: 1px solid transparent; cursor: pointer;
    transition: transform .2s var(--ease-ios), box-shadow .2s ease, background .2s ease, border-color .2s ease, opacity .2s ease;
  }
  .btn:active{ transform: scale(.97); }
  .btn:disabled{ cursor: default; }
  .btn-primary{ background: var(--brand); color: white; }
  .btn-primary:hover{ background: var(--brand-2); }
  .btn-ghost{ background: var(--fill); color: var(--ink); }
  .btn-ghost:hover{ background: rgba(118,118,128,.18); }

  /* Number ticker */
  .ticker{ font-variant-numeric: tabular-nums; }

  /* Marquee */
  .marquee{ overflow: hidden; mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent); }
  .marquee-track{ display: flex; gap: 56px; animation: marq 30s linear infinite; }
  @keyframes marq{ to{ transform: translateX(-50%); } }

  /* Dashboard preview chrome */
  .chrome-dot{ width:10px; height:10px; border-radius:50%; }

  /* tilt parallax preview */
  .tilt{ transform-style: preserve-3d; transition: transform .2s ease; }

  /* Section heading */
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; padding: 6px 12px; border-radius: 999px;
    background: var(--glass-strong); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--hairline); color: var(--ink-2); font-size: 12px; font-weight: 600;
  }
  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background: var(--brand); box-shadow: 0 0 0 4px color-mix(in oklch, var(--brand) 16%, transparent); }
  h1, h2, h3{ letter-spacing: -.022em; }
  .h-display{ font-size: clamp(40px, 6.6vw, 80px); line-height: 1.04; font-weight: 700; letter-spacing: -.04em; }
  .h-section{ font-size: clamp(32px, 4.4vw, 56px); line-height: 1.07; font-weight: 700; letter-spacing: -.035em; }
  .lede{ color: var(--muted); font-size: clamp(17px, 1.6vw, 21px); line-height: 1.45; letter-spacing: -.01em; }
  /* Texto com o degradê das telas de produto (títulos de destaque). */
  .grad-text{ background: linear-gradient(90deg, var(--brand), var(--violet) 55%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* Chip */
  .chip{ display:inline-flex; align-items:center; gap:6px; padding: 4px 10px; border-radius: 999px; background: var(--fill-2); color: var(--ink-2); font-size: 12px; font-weight: 500; }

  /* Section pad */
  section{ position: relative; }
  .pad{ padding: 96px 24px; }
  .wrap{ max-width: 1240px; margin: 0 auto; }

  /* Hero parallax dashboard */
  .preview-shell{
    border-radius: 14px;
    background: linear-gradient(180deg, #fff, #fbfbfd);
    border: 1px solid rgba(0,0,0,.1);
    overflow: hidden;
    box-shadow:
      0 0 0 .5px rgba(0,0,0,.05),
      0 30px 60px -24px rgba(0,0,0,.30),
      0 80px 140px -40px color-mix(in oklch, var(--brand) 22%, transparent);
  }

  /* Counters strip */
  .strip{
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
    padding: 24px; border: 1px solid var(--hairline); border-radius: 22px; background: white;
  }

  /* Step number */
  .step-num{
    width: 36px; height: 36px; border-radius: 11px;
    background: linear-gradient(180deg, #3a3a3c, #1d1d1f); color: white;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
  }

  /* Feature card */
  /* Blocos em "bento": cantos grandes, sem borda forte, crescem de leve no hover. */
  .feat{
    padding: 26px; border: 1px solid var(--hairline); border-radius: 28px; background: white;
    transition: transform .5s var(--ease-ios), box-shadow .5s var(--ease-ios);
  }
  .feat:hover{ transform: scale(1.015); box-shadow: 0 30px 60px -30px rgba(0,0,0,.22); }

  /* Dashboard view styles */
  .topbar{ position: sticky; top: 0; -webkit-backdrop-filter: var(--glass-blur) !important; backdrop-filter: var(--glass-blur) !important; background: rgba(245,245,247,.72) !important; z-index: 30; border-bottom: 1px solid var(--hairline) !important; }
  .kpi-card{
    padding: 18px; border-radius: 20px; background: white; border: 1px solid var(--hairline); box-shadow: var(--shadow-card);
    display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden;
  }
  .kpi-card .spark{ position:absolute; right:-6px; bottom:-6px; opacity:.85; }
  .chart-card{
    padding: 20px; border-radius: 22px; background: white; border: 1px solid var(--hairline); box-shadow: var(--shadow-card);
    display: flex; flex-direction: column; gap: 14px;
  }
  .icon-btn{
    width: 32px; height: 32px; border-radius: 50%; border: 0;
    background: var(--fill); display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-2); cursor: pointer; transition: background .2s ease, transform .2s var(--ease-ios);
  }
  .icon-btn:hover{ background: rgba(118,118,128,.2); }
  .icon-btn:active{ transform: scale(.92); }
  /* Controle segmentado: trilho cinza e "polegar" branco elevado. */
  .seg{
    display: inline-flex; padding: 2px; border-radius: 9px; background: var(--fill); gap: 0;
  }
  .seg button{
    padding: 6px 12px; border: 0; background: transparent; border-radius: 7px; cursor: pointer;
    color: var(--ink); font-size: 12.5px; font-weight: 500; transition: background .2s ease, box-shadow .2s ease;
  }
  .seg button.on{ background: white; color: var(--ink); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04), 0 0 0 .5px rgba(0,0,0,.04); }

  /* Pin progress dots */
  .pin-dots{ display:flex; gap:6px; }
  .pin-dot{ width:6px; height:6px; border-radius:50%; background: var(--line); }
  .pin-dot.on{ background: var(--ink); }

  /* Insight chips list */
  .insight-row{
    display:flex; gap:10px; align-items:flex-start; padding: 12px 14px;
    border: 1px solid var(--hairline); border-radius: 14px; background: #fbfbfd;
  }

  /* CTA banner */
  .cta-banner{
    border-radius: 32px; padding: 56px 40px; color: white;
    background:
      radial-gradient(ellipse at 15% 0%, color-mix(in oklch, var(--brand) 55%, transparent), transparent 55%),
      radial-gradient(ellipse at 100% 100%, color-mix(in oklch, var(--violet) 45%, transparent), transparent 55%),
      #000;
    position: relative; overflow: hidden;
  }

  /* Marquee track items */
  .marquee-item{ color: var(--muted); font-weight: 500; white-space: nowrap; display:flex; align-items:center; gap:10px; }

  /* Footer */
  footer{ padding: 48px 24px; border-top: 1px solid var(--hairline); background: var(--bg); color: var(--muted); }

  /* Paywall blur */
  .paywall-blur{ position: relative; }
  .paywall-blur > .pw-content{
    filter: blur(8px) saturate(.7);
    pointer-events: none;
    user-select: none;
  }
  .paywall-blur > .pw-overlay{
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.35); -webkit-backdrop-filter: saturate(160%); backdrop-filter: saturate(160%);
    border-radius: inherit;
    z-index: 5;
  }
  .pw-card{
    background: var(--glass-strong); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-pop);
    border-radius: 22px; padding: 20px 24px; max-width: 420px; text-align: center;
  }
  .fab-bar{
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: inline-flex; gap: 4px; padding: 6px;
    background: rgba(29,29,31,.78); color: white;
    border-radius: 999px; -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    box-shadow: 0 24px 50px -18px rgba(0,0,0,.45), 0 0 0 .5px rgba(255,255,255,.12) inset;
    z-index: 40; transition: transform .4s var(--ease-ios), opacity .25s ease;
  }
  .fab-bar button{
    background: transparent; border: 0; color: white; padding: 10px 16px;
    border-radius: 999px; font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    transition: background .15s ease;
  }
  .fab-bar button:hover{ background: rgba(255,255,255,.1); }
  .fab-bar button:active{ transform: scale(.96); }
  .fab-bar button.primary{ background: var(--brand); }
  .fab-bar button.primary:hover{ background: var(--brand-2); }
  .fab-bar button.active{ background: rgba(255,255,255,.12); }
  .fab-bar .div{ width:1px; background: rgba(255,255,255,.15); margin: 4px 2px; }

  /* Block hover affordance */
  .block-wrap{ position: relative; }
  .block-menu-btn{
    position: absolute; top: 10px; right: 12px; z-index: 4;
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid transparent; background: transparent; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s ease; opacity: 0;
  }
  .block-wrap:hover .block-menu-btn{ opacity: 1; }
  .block-menu-btn:hover, .block-menu-btn.open{
    background: var(--fill); border-color: transparent; color: var(--ink); opacity: 1;
  }
  /* Menu de contexto: vidro, cantos de 14 e entrada com leve escala. */
  .block-menu{
    position: absolute; top: 42px; right: 12px; z-index: 6;
    min-width: 190px; padding: 5px; background: var(--glass-strong);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--hairline); border-radius: 14px;
    box-shadow: var(--shadow-pop);
    transform-origin: top right; animation: menuIn .22s var(--ease-ios);
  }
  @keyframes menuIn{ from{ opacity:0; transform: scale(.92); } }
  .block-menu button{
    width: 100%; padding: 8px 10px; border: 0; background: transparent;
    border-radius: 9px; display: flex; align-items: center; gap: 10px;
    cursor: pointer; font-size: 13px; color: var(--ink-2); text-align: left;
  }
  .block-menu button:hover{ background: var(--brand); color: white; }
  .block-menu button.danger{ color: #ff3b30; }
  .block-menu button.danger:hover{ background: #ff3b30; color: white; }
  .block-menu hr{ border: 0; border-top: 1px solid var(--hairline); margin: 4px 6px; }

  /* Hover lift */
  .lift{ transition: transform .3s ease, box-shadow .3s ease; }
  .lift{ transition: transform .4s var(--ease-ios), box-shadow .4s var(--ease-ios); }
  .lift:hover{ transform: translateY(-3px); box-shadow: 0 24px 40px -24px rgba(0,0,0,.2); }

  /* Floating cards in hero */
  .float-card{
    position: absolute; background: var(--glass-strong); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--hairline); border-radius: 16px;
    padding: 10px 12px; box-shadow: 0 20px 40px -20px rgba(0,0,0,.25);
    display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600;
  }

  /* Dashboard hero glow */
  .glow-ring{
    position: absolute; inset: -40px; pointer-events: none;
    background: radial-gradient(closest-side, color-mix(in oklch, var(--brand) 15%, transparent), transparent 70%);
    filter: blur(8px);
  }

  /* Fluxo de geração (dashboard-flow.jsx) */
  .flow-wrap{ max-width: 1120px; margin: 28px auto 0; padding: 0 24px 72px; }
  .flow-title{ margin: 0 0 10px; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.08; font-weight: 700; letter-spacing: -.035em; }
  .flow-steps{ list-style: none; margin: 0 auto 22px; padding: 0; display: flex; justify-content: center; align-items: center; gap: 0; }
  .flow-steps li{ display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .flow-steps li + li::before{ content: ""; width: 48px; height: 2px; border-radius: 2px; background: var(--line); margin: 0 12px; }
  .flow-steps li.done + li::before, .flow-steps li.on + li.on::before{ background: var(--brand); }
  .flow-steps li.done + li.on::before{ background: linear-gradient(90deg, var(--brand), color-mix(in oklch, var(--brand) 40%, white)); }
  .flow-dot{ width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: white; border: 1.5px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
  .flow-steps li.on{ color: var(--ink); }
  .flow-steps li.on .flow-dot{ background: var(--brand); border-color: var(--brand); color: white; box-shadow: 0 0 0 4px color-mix(in oklch, var(--brand) 18%, white); }
  .flow-steps li.done{ color: var(--ink-2); }
  .flow-steps li.done .flow-dot{ background: color-mix(in oklch, var(--brand) 12%, white); border-color: color-mix(in oklch, var(--brand) 40%, white); color: var(--brand); }
  .dropzone{
    min-height: 330px; border: 2px dashed #d2d2d7; border-radius: 22px; background: #fbfbfd;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 28px 20px; cursor: pointer; transition: border-color .2s ease, background .2s ease;
  }
  .dropzone:hover{ border-color: color-mix(in oklch, var(--brand) 55%, white); background: color-mix(in oklch, var(--brand) 4%, white); }
  .dropzone.drag{ border-color: var(--brand); background: var(--brand-soft); }

  .dz-icon{ width: 60px; height: 60px; border-radius: 18px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; color: white; background: linear-gradient(180deg, color-mix(in oklch, var(--brand) 80%, white), var(--brand)); box-shadow: 0 16px 32px -14px color-mix(in oklch, var(--brand) 70%, transparent); transition: transform .25s ease; }
  .dropzone:hover .dz-icon, .dropzone.drag .dz-icon{ transform: translateY(-3px); }
  .field{ width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; -webkit-appearance: none; appearance: none; font-family: inherit; font-size: 14px; color: var(--ink); background: white; outline: none; transition: border-color .15s ease, box-shadow .15s ease; }

  .metric-opt{ display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 12px; text-align: left; cursor: pointer; font: inherit; color: inherit; border: 1px solid var(--hairline); background: white; transition: border-color .15s ease, background .15s ease; }

  .link-btn{ border: 0; background: transparent; color: var(--brand); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; padding: 2px 4px; border-radius: 6px; }

  .flow-sticky{ position: sticky; top: 84px; }

  /* Acessibilidade: foco visível em todo interativo (teclado) e animações
     reduzidas para quem pede no sistema (CLAUDE.md §9). */
  :focus-visible{ outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
  .btn:focus-visible, .seg button:focus-visible{ outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important; scroll-behavior: auto !important;
    }
  }

  /* Responsividade. Colapsa grids multi-coluna para 1 coluna no mobile.
     !important é necessário porque as colunas vêm de estilo inline nos .jsx
     — só author !important sobrescreve inline. Classes opt-in: resp-collapse
     (grids), tb-* (Topbar do app), acct-* (Conta). */
  /* Exportação PDF/PNG (components/dashboard-export.jsx). Enquanto o body tem
     .dash-exporting, some tudo que é controle e aparece o que é só do arquivo.
     Os gráficos têm o estado final como estilo base, então desligar as
     animações (inclusive na cópia que o html-to-image faz) mostra tudo. */
  /* Página pública de link (share-view.jsx): sem controles de edição. */
  .dash-readonly .icon-btn,
  .dash-readonly .block-menu-btn{ display: none !important; }

  .export-only{ display: none !important; }
  body.dash-exporting .export-only{ display: flex !important; }
  body.dash-exporting.export-no-brand .export-brand{ display: none !important; }
  body.dash-exporting .no-export,

  body.dash-exporting .rv{ opacity: 1 !important; transform: none !important; filter: none !important; transition: none !important; }
  body.dash-exporting svg *{ animation: none !important; }

  /* Barra de navegação inferior do celular (components/mobile-nav.jsx). Só

    .tabbar button:active{ transform: scale(.92); }

    body.has-tabbar{ padding-bottom: calc(76px + env(safe-area-inset-bottom)); }

  /* Itens da barra lateral (Painel e Conta): hover só nos não selecionados. */
  .side-item:not([aria-current]):hover{ background: var(--fill-2) !important; }

  /* Chave liga/desliga (input checkbox com .switch). */
  input.switch{
    -webkit-appearance: none; appearance: none; flex-shrink: 0; margin: 0; cursor: pointer;
    width: 46px; height: 28px; border-radius: 999px; position: relative;
    background: rgba(120,120,128,.16); transition: background .25s ease;
  }
  input.switch::before{
    content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%;
    background: white; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06);
    transition: transform .3s var(--ease-ios);
  }
  input.switch:checked{ background: #34c759; }
  input.switch:checked::before{ transform: translateX(18px); }
  input.switch:disabled{ opacity: .45; cursor: default; }
  input.switch:focus-visible{ outline: 2px solid var(--brand); outline-offset: 2px; }

  /* Lista agrupada (Ajustes): fundo branco, linhas separadas por fio que

  .group-list{ background: white; border: 1px solid var(--hairline); border-radius: 14px; overflow: hidden; }
  .group-row{ display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px; border: 0; background: transparent;

  .group-row:active{ background: var(--fill); }

  .group-chev{ color: #c7c7cc; flex-shrink: 0; }
  .group-label{ font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .02em; margin: 18px 14px 6px; }

  /* Bloco de resumo pela IA: borda com o degradê de cores, que gira enquanto
     a IA escreve. */
  .ai-card{ position: relative; border-color: transparent !important; isolation: isolate; }
  .ai-card::before{
    content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; z-index: -1; pointer-events: none;
    background: conic-gradient(from var(--ai-angle, 0deg), #0071e3, #5e5ce6, #bf5af2, #ff375f, #ff9f0a, #5e5ce6, #0071e3);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; opacity: .55;
  }
  .ai-card.thinking::before{ opacity: 1; animation: aiSpin 3s linear infinite; }
  .ai-card.thinking::after{
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -2; pointer-events: none;
    box-shadow: 0 0 40px -6px color-mix(in oklch, #bf5af2 45%, transparent), 0 0 60px -10px color-mix(in oklch, #0071e3 40%, transparent);
    animation: aiPulse 2.4s ease-in-out infinite;
  }
  @property --ai-angle{ syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes aiSpin{ to{ --ai-angle: 360deg; } }
  @keyframes aiPulse{ 50%{ opacity: .45; } }
  body.dash-exporting .ai-card::before, body.dash-exporting .ai-card::after{ display: none; }

  /* Fundo dos modais e "sheet" que sobe de baixo no celular. */
  .sheet-backdrop{ background: rgba(0,0,0,.28) !important; -webkit-backdrop-filter: blur(6px) saturate(120%); backdrop-filter: blur(6px) saturate(120%) !important; animation: fadeIn .25s ease; }
  .sheet{ background: white; border-radius: 22px !important; border: 1px solid var(--hairline) !important; box-shadow: var(--shadow-pop) !important; animation: popIn .35s var(--ease-ios); }
  @keyframes fadeIn{ from{ opacity: 0; } }
  @keyframes popIn{ from{ opacity: 0; transform: scale(.96); } }
  @keyframes sheetUp{ from{ transform: translateY(100%); } }
  @media (max-width: 640px){
    .sheet-backdrop{ align-items: flex-end !important; padding: 0 !important; }
    .sheet{
      width: 100% !important; max-width: none !important; max-height: 92vh !important; overflow-y: auto !important;
      border-radius: 18px 18px 0 0 !important; padding-bottom: calc(env(safe-area-inset-bottom) + 18px) !important;
      animation: sheetUp .45s var(--ease-ios) !important; position: relative;
    }
    .sheet::before{ content: ""; position: sticky; top: 0; display: block; width: 36px; height: 5px; border-radius: 3px;

  /* Grid do dashboard (dashboard.jsx): o tamanho escolhido (span de 12) vale
     no desktop; em telas menores os blocos se reorganizam. !important porque o

  @media (max-width: 640px){

  <script type="text/babel">
    // Deep links de e-mail/checkout. O backend manda ?verify=<token> e
    // ?reset=<token>; o checkout do Asaas volta com ?upgrade=ok|cancel|expired.
    (function () {
      var params = new URLSearchParams(window.location.search);
      function clearQuery() {
        history.replaceState(null, "", window.location.pathname + window.location.hash);
      }

      var verify = params.get("verify");
      var reset = params.get("reset");
      var upgrade = params.get("upgrade");

      if (verify) {
        window.DashAPI.verifyEmail(verify)
          .then(function () {
            window.DashAPI.me().catch(function () {}); // atualiza o selo "E-mail confirmado"
            window.alert("E-mail confirmado! Você já pode usar sua conta.");
          })
          .catch(function () { window.alert("Não foi possível confirmar o e-mail. O link pode ter expirado."); })
          .finally(clearQuery);
        return;
      }

      // ?reset=<token> é tratado pelo App: abre a tela "Defina uma nova senha"
      // (AuthView, modo reset) e tira o token da URL.
      if (reset) return;

      if (upgrade === "ok") {
        window.dashTrack("checkout_concluido");
        window.DashAPI.me()
          .catch(function () {})
          .finally(function () {
            window.alert("Plano ativado! Obrigado pela assinatura.");
            clearQuery();
          });
      } else if (upgrade === "cancel" || upgrade === "expired") {
        window.alert("Pagamento não concluído. Você pode tentar novamente quando quiser.");
        clearQuery();
      }
    })();
  </script>
